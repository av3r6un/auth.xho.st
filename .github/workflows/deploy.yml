name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
jobs:
  build-push-and-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0
      - name: Calculate Version
        shell: bash
        run: |
          set -euo pipefail
          merge_count="$(git rev-list --count --merges HEAD)"
          version="0.1.${merge_count}"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${version}" >> "$GITHUB_ENV"
          echo "APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "APP_GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log In To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build And Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            JWT_PRIVATE_KEY_B64=${{ secrets.JWT_PRIVATE_KEY_B64 }}
            JWT_PUBLIC_KEY_B64=${{ secrets.JWT_PUBLIC_KEY_B64 }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.APP_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ env.APP_BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare Deployment Environment
        shell: bash
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_ENV_FILE" > deployment.env
          {
            printf 'DOCKER_IMAGE=%s\n' "$DOCKER_IMAGE"
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'APP_VERSION=%s\n' "$APP_VERSION"
            printf 'APP_BUILD_TIME=%s\n' "$APP_BUILD_TIME"
            printf 'APP_GIT_SHA=%s\n' "$APP_GIT_SHA"
          } >> deployment.env
      - name: Prepare VPS Deployment Directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            test -w "${{ secrets.DEPLOY_PATH }}"
      - name: Copy Deployment Files
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Upload Deployment Files With SCP
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp -v -P "$VPS_PORT" \
            docker-compose.yml deployment.env \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/"
      - name: Pull And Start On Server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DOCKERHUB_TOKEN,DOCKERHUB_USERNAME
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            mv deployment.env .env
            chmod 600 .env
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose config --quiet
            docker compose pull
            docker compose up -d --remove-orphans --wait --wait-timeout 120
