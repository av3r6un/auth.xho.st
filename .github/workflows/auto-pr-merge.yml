name: Auto PR And Merge

on:
  push:
    branches-ignore:
      - master
  workflow_run:
    workflows:
      - CI And PR
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  create-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create Or Reuse Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'master';

            if (head === base) {
              core.info('Branch is master, skipping PR creation.');
              return;
            }

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });

            if (existing.length > 0) {
              core.info(`PR #${existing[0].number} already exists for ${head} -> ${base}.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: `Auto merge ${head} into ${base}`,
              body: [
                'This pull request was created automatically by GitHub Actions.',
                '',
                `Source branch: \`${head}\``,
                `Target branch: \`${base}\``,
              ].join('\n'),
            });

            core.info(`Created PR #${pr.number}.`);

  auto-merge:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_branch != 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Merge Pull Request After Successful CI
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.payload.workflow_run.head_branch;
            const base = 'master';

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });

            if (prs.length === 0) {
              core.info(`No open PR found for ${head} -> ${base}.`);
              return;
            }

            const pr = prs[0];

            let prDetails;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              prDetails = response.data;
              if (prDetails.mergeable !== null) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!prDetails.mergeable) {
              core.setFailed(`PR #${pr.number} is not mergeable right now.`);
              return;
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'merge',
            });

            core.info(`Merged PR #${pr.number}.`);
