name: CI And PR

on:
  push:
    branches-ignore:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Prepare CI Compose Override
        shell: bash
        run: |
          cat > docker-compose.ci.yml <<'YAML'
          services:
            vs-auth:
              image: xhost-auth-ci:latest
              build: .
              environment:
                DB_URL: sqlite+aiosqlite:////app/storage/ci.db
                DEBUG: "0"
                APP_PORT: "8090"
                JWT_PRIVATE_KEY: src/config/_private.pem
                JWT_PUBLIC_KEY: src/config/_pub.pem
                JWT_ACCESS_TOKEN_EXPIRES: "86400"
                JWT_REFRESH_TOKEN_EXPIRES: "2592000"
                AUTHORITY: auth.xho.st
                KID: ci-rsa-2026-06
              ports:
                - "8090:8090"
          YAML

      - name: Build Containers
        run: docker compose -f docker-compose.ci.yml build

      - name: Start Containers
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Check Health Endpoint
        shell: bash
        run: |
          set -e
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:8090/health" | python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"]=="success" and data["body"]["ok"] is True'; then
              echo "Healthcheck passed"
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck failed"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      - name: Check Auth Flow And Protected Endpoint
        shell: bash
        run: |
          set -e
          EMAIL="ci-user@example.com"
          PASSWORD="StrongTestPass123!"

          REGISTER_RESPONSE="$(curl -fsS -X POST "http://127.0.0.1:8090/register" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}}")"
          echo "${REGISTER_RESPONSE}" | python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"]=="success"'

          LOGIN_RESPONSE="$(curl -fsS -X POST "http://127.0.0.1:8090/" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}}")"
          TOKEN="$(echo "${LOGIN_RESPONSE}" | python -c 'import json,sys; data=json.load(sys.stdin); print(data["body"]["access_token"])')"

          curl -fsS -H "Authorization: Bearer ${TOKEN}" "http://127.0.0.1:8090/me" | python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"]=="success"; assert data["body"]["user"]["email"]=="ci-user@example.com"'

      - name: Show Logs On Failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Stop Containers
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  create-and-merge-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    needs: docker-build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check Automation Token
        shell: bash
        run: |
          if [ -z "${{ secrets.AUTOMATION_TOKEN }}" ]; then
            echo "AUTOMATION_TOKEN secret is required so merge-to-master can trigger deploy workflow."
            exit 1
          fi

      - name: Create Or Merge Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'master';

            if (head === base) {
              core.info('Branch is master, skipping auto-merge.');
              return;
            }

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });

            let pr = existing[0];

            if (!pr) {
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                head,
                base,
                title: `Auto merge ${head} into ${base}`,
                body: [
                  'This pull request was created automatically by GitHub Actions after CI passed.',
                  '',
                  `Source branch: \`${head}\``,
                  `Target branch: \`${base}\``,
                ].join('\n'),
              });
              pr = created;
              core.info(`Created PR #${pr.number}.`);
            } else {
              core.info(`Reusing PR #${pr.number}.`);
            }

            let prDetails;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              prDetails = response.data;
              if (prDetails.mergeable !== null) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!prDetails?.mergeable) {
              core.setFailed(`PR #${pr.number} is not mergeable right now.`);
              return;
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'merge',
            });

            core.info(`Merged PR #${pr.number}.`);

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${head}`,
            });

            core.info(`Deleted branch ${head}.`);
